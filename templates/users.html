{% extends 'base.html' %}{% block content %}<h2 class="page-title mb-4">Registered People</h2><div class="row g-4"><div class="col-lg-4"><div class="card-box"><h5>Add person</h5><form method="post"><input class="form-control mb-2" name="name" placeholder="Full name" required><input class="form-control mb-2" name="phone" placeholder="+91..." required><input class="form-control mb-2" name="email" type="email" placeholder="Email (optional)"><div class="row"><div class="col"><input class="form-control mb-2" name="latitude" type="number" step="any" placeholder="Latitude"></div><div class="col"><input class="form-control mb-2" name="longitude" type="number" step="any" placeholder="Longitude"></div></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="consent" id="consent" checked><label class="form-check-label" for="consent">SMS notification consent recorded</label></div><button class="btn emergency-btn w-100">Register Person</button></form></div></div><div class="col-lg-8"><div class="card-box"><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Location</th><th>Consent</th></tr></thead><tbody>{% for p in people %}<tr><td>{{ p.name }}</td><td>{{ p.phone }}</td><td>{{ p.latitude }}, {{ p.longitude }}</td><td>{{ 'Yes' if p.consent_sms else 'No' }}</td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
