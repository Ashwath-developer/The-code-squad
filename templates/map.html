{% extends 'base.html' %}{% block content %}<h2 class="page-title mb-3">Interactive Location Map</h2><div class="card-box"><div id="incidentMap"></div></div>{% endblock %}{% block scripts %}<script>const map=L.map('incidentMap').setView([12.9716,77.5946],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);{% for p in people %}{% if p.latitude and p.longitude %}L.circleMarker([{{p.latitude}},{{p.longitude}}],{radius:6,color:'#2563eb',fillOpacity:.8}).bindPopup({{p.name|tojson}}).addTo(map);{% endif %}{% endfor %}{% for i in incidents %}L.marker([{{i.latitude}},{{i.longitude}}],{title:{{i.title|tojson}}}).bindPopup({{i.title|tojson}}).addTo(map);L.circle([{{i.latitude}},{{i.longitude}}],{radius:{{i.radius_meters}},color:'#ef4444',fillColor:'#ef4444',fillOpacity:.12}).addTo(map);{% endfor %}</script>{% endblock %}
