{% extends 'base.html' %}{% block content %}<h2 class="page-title mb-4">Final Incident Reports</h2><div class="row g-3">{% for r in reports %}<div class="col-lg-6"><div class="card-box"><h5>{{r.title}}</h5><p class="text-muted">Incident #{{r.incident_id}} · {{r.created_at}}</p><pre class="small">{{r.report_json}}</pre></div></div>{% else %}<div class="col-12"><div class="card-box text-muted">No reports generated yet. Submit a fire incident to start the workflow.</div></div>{% endfor %}</div>{% endblock %}
