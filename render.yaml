services:
  - type: web
    name: quickfire-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@quickfire.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        value: /tmp/quickfire.db
      - key: SMS_MODE
        value: simulation
      - key: MAX_SMS_RETRIES
        value: "2"
